server:
  port: 80
spring:
  application:
    name: FlyCms
  mvc:
    static-path-pattern: /**
  # G29：devtools 默认关闭（热重载与缓存易打架）；开发时加 --spring.profiles.active=dev 启用
  devtools:
    enabled: false
  web:
    resources:
      static-locations:
        - file:./uploadfiles/
        - file:./views/static/
  freemarker:
    checkTemplateLocation: false
    template-loader-path:
    - file:./views/templates/
    # 开发默认关闭（改完模板立刻生效，无需重启）；生产用 prod profile 覆盖为 true（§10）
    # 生产启动：--spring.profiles.active=prod
    cache: false
    settings:
          auto_import: /spring.ftl as spring
          number_format: 0.##
    suffix: .html
  servlet:
      session:
         cookie:
           httpOnly: true
           # 阶段 K2/G2：SameSite=Lax —— 阻止跨站请求携带会话 Cookie（CSRF 第一道防线）；
           # 同时不影响从外部链接跳回后台的常规导航（Lax 允许顶层 GET 导航携带）。
           sameSite: lax
      multipart:
        max-file-size: 2MB
        max-request-size: 2MB
  messages:
     fallbackToSystemLocale: false
     basename: i18n/messages
     encoding: UTF-8
  ##数据库连接信息
  datasource:
      url: jdbc:mysql://127.0.0.1:3306/flycms?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: ${FLYCMS_DB_USER:root}
      password: ${FLYCMS_DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      ###################以下为druid增加的配置###########################
      type: com.alibaba.druid.pool.DruidDataSource
      # 下面为连接池的补充设置，应用到上面所有数据源中
      # 初始化大小，最小，最大
      initialSize: 5
      minIdle: 5
      # 32 起（原 20 偏小）：配合线程池与慢查询余量可调，生产用环境变量覆盖
      maxActive: ${FLYCMS_DB_MAX_ACTIVE:32}
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
      filters: stat,wall
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 合并多个DruidDataSource的监控数据
      useGlobalDataSourceStat: true
      ###############以上为配置druid添加的配置########################################

mybatis:
    type-aliases-package: com.flycms.module.**.model
    mapper-locations: classpath:mapper/**/*.xml
    configuration:
        mapUnderscoreToCamelCase: true
        default-fetch-size: 100
        default-statement-timeout: 30
        cache-enabled: true

# 打印sql
logging:
    level:
        learning: trace
        # G12 恢复 SQL 排查（2026-09-29，问题定位后可关）
        com.flycms.module.model.dao.ContentVersionDao: debug
        #com.flycms.module.score.dao : DEBUG  #直接写包路径，不能用*通配符
        #com.flycms.module.user.dao : DEBUG
        #com.flycms.module.article.dao : DEBUG
        #com.flycms.module.question.dao : DEBUG
        #com.flycms.module.topic.dao : DEBUG
        #com.flycms.module.other.dao : DEBUG
        #com.flycms.module.job.dao : DEBUG
        #com.flycms.module.links.dao : DEBUG
    pattern:
        console: "%d{yyyy/MM/dd-HH:mm:ss} [%thread] %-5level %logger- %msg%n"
    file:
        name: "logs/flycms-logging.log"

#网站基本设置
site:
  #sessionKey名称
  sessionKey: "FlyCmsId"
  #cookie所在的域，留空则 cookie 仅对当前主机生效（推荐）；
  #如需主域下多子站共享登录态，部署时改为实际域名，如 ".example.com"
  cookieDomain: ""

# ============================================================
# 安全与跨域（阶段 K2/G2）
# ------------------------------------------------------------
# CORS 默认只放行本机；CSRF 默认已切强制（前端 api/request.ts 回填 X-XSRF-TOKEN），
# 生产由 prod profile 覆盖 CORS 域名。Druid 监控台默认不注册。
# 详见《主流CMS对标与全项目优化开发方案》§7.2。
# ============================================================
flycms:
  cors:
    # 允许跨域的主机名白名单（逗号分隔，不带协议与端口）。空值=不启用 CORS（纯同源部署）
    allowed-hosts: "localhost,127.0.0.1"
  security:
    csrf:
      # true=强制校验（/api/** 的 POST/PUT/PATCH/DELETE 缺 X-XSRF-TOKEN 返回 403）
      # 前端已在 api/request.ts 回填该请求头（双提交 cookie），校验开启后不影响后台写操作
      enabled: true
      header-name: "X-XSRF-TOKEN"
      cookie-name: "XSRF-TOKEN"
      path-prefix: "/api/"
    csp:
      # 保守策略：只禁嵌套/插件对象/篡改 base，不限制脚本与样式来源（避免打挂存量前台内联脚本）
      policy: "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    hsts:
      max-age: 31536000
      include-subdomains: true
  # Druid 监控台（默认关闭）：仅在受控环境显式开启并配置账号口令，
  # 口令不得写死在源码里，故本文件不提供默认值。
  # 开启示例：FLYCMS_DRUID_ENABLED=true FLYCMS_DRUID_USER=xxx FLYCMS_DRUID_PASSWORD=xxx
  druid:
    enabled: false
    username: ""
    password: ""
    # 来源白名单；若部署在反向代理之后，务必改为运维真实出口网段（否则 remoteAddr 恒为代理地址）
    allow: "127.0.0.1"

---
# ============================================================
# 生产 profile（§10 缓存与性能）
# 启用：java -jar ... --spring.profiles.active=prod
# 或      mvn -o spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=prod"
#
# 开启 FreeMarker 模板编译缓存显著降低首字节时间；"改了不生效"由两条路径兜底：
#   ① 保存模板 → TemplateCenterService.evictTemplate() 精确移除该模板缓存
#   ② 切换主题 / 保存站点配置 → themeRegistry.refresh() + 后台「清空模板缓存」按钮
# ============================================================
---
# ============================================================
# dev profile（G29）：开发热重载。启动：mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  freemarker:
    cache: true
    template_update_delay: 0
  devtools:
    # 生产必须关闭 devtools 自动重启（否则缓存与热重载相互打架）
    enabled: false
  servlet:
    session:
      cookie:
        # 阶段 K2/G2：生产强制 HTTPS-only Cookie
        secure: true
  # 生产数据库账号口令必须由环境变量提供（不提供默认值：缺配置直接启动失败，
  # 避免带着开发弱口令 123456 上线）
  datasource:
    username: ${FLYCMS_DB_USER}
    password: ${FLYCMS_DB_PASSWORD}

# 生产：CORS 只放行真实域名（不再出现 localhost）。
# CSRF 已切强制：前端 api/request.ts 会回填 X-XSRF-TOKEN（双提交 cookie）；
# 若有非浏览器客户端（脚本/移动端）直连 /api/**，需自行回填该请求头。
flycms:
  cors:
    allowed-hosts: "www.28844.com,28844.com"
  security:
    csrf:
      enabled: true
  # 生产严禁开启 Druid 监控台（会暴露 SQL / URI / 会话信息）
  druid:
    enabled: false