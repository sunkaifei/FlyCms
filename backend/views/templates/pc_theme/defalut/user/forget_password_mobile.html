<#-- 手机找回密码：图形码 → 短信码 → 新密码（同一表单提交给 /forget_password/update_password） -->
<#assign pageTitle = "手机找回密码">
<#include "../common/macros.html">
<#include "../common/header.html">
<main id="main">
<div class="auth">
  <div class="auth-card">
    <div class="auth-hd">
      <h1>手机找回密码</h1>
      <p>填手机号并获取短信验证码，验证通过后设置新密码</p>
    </div>
    <form data-ajax data-ok-url="/login" action="/forget_password/update_password" method="post">
      <div class="field">
        <label for="username"><span class="req">*</span>手机号码</label>
        <input id="username" name="username" type="tel" required maxlength="11" inputmode="numeric"
               autocomplete="tel" placeholder="注册时使用的手机号">
      </div>
      <div class="field">
        <label for="captcha"><span class="req">*</span>图形验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" type="text" required maxlength="8" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="发送短信前需先填图形码">
          <img data-captcha src="/captcha/default" alt="点击刷新验证码" title="点击刷新验证码" width="146" height="33">
        </div>
      </div>
      <div class="field">
        <label for="code"><span class="req">*</span>短信验证码</label>
        <div class="code-row">
          <input id="code" name="code" type="text" required maxlength="6" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="收到的短信码">
          <button type="button" class="btn btn-outline"
                  data-post="/forget_password/getbackcode" data-fields="username,captcha"
                  data-count="60" data-label="获取验证码">获取验证码</button>
        </div>
      </div>
      <div class="field">
        <label for="password"><span class="req">*</span>新密码</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="30"
               autocomplete="new-password" placeholder="6 - 30 位">
      </div>
      <button class="btn btn-primary btn-block" type="submit">提交</button>
    </form>
    <div class="auth-foot"><a href="/forget_password">换一种方式</a> · <a href="/login">返回登录</a></div>
  </div>
</div>
</main>
<#include "../common/footer.html">
