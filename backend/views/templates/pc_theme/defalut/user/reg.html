<#-- 注册页：邮箱/用户名 与 手机号 两种方式分段切换（radio + data-switch，无 JS 时只显示第一种） -->
<#assign pageTitle = "注册新账号">
<#include "../common/macros.html">
<#include "../common/header.html">
<main id="main">
<div class="auth">
  <div class="auth-card">
    <div class="auth-hd">
      <h1>创建新账号</h1>
      <p>注册即可评论、提问与投稿</p>
    </div>
    <div class="switch" data-switch>
      <label><input type="radio" name="regMode" value="mail" checked><span>邮箱 / 用户名</span></label>
      <label><input type="radio" name="regMode" value="phone"><span>手机号</span></label>
    </div>

    <form data-pane="mail" data-ajax data-ok-url="/login" action="/ucenter/reg_user" method="post">
      <input type="hidden" name="invite" value="${((invite)!'')?html}">
      <div class="field">
        <label for="username"><span class="req">*</span>用户名 / 邮箱</label>
        <input id="username" name="username" type="text" required maxlength="50"
               autocomplete="username" placeholder="作为登录名，建议用邮箱">
      </div>
      <div class="field">
        <label for="password"><span class="req">*</span>密码</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="16"
               autocomplete="new-password" placeholder="6 - 16 位">
      </div>
      <div class="field">
        <label for="password2"><span class="req">*</span>确认密码</label>
        <input id="password2" name="password2" type="password" required minlength="6" maxlength="16"
               autocomplete="new-password" placeholder="再输入一次">
      </div>
      <div class="field">
        <label for="captcha"><span class="req">*</span>验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" type="text" required maxlength="8" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="请输入右侧 4 位字符">
          <img data-captcha src="/captcha/default" alt="点击刷新验证码" title="点击刷新验证码" width="146" height="33">
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">注册</button>
    </form>

    <form data-pane="phone" data-ajax data-ok-url="/login" action="/ucenter/addMobileUser" method="post" hidden>
      <input type="hidden" name="invite" value="${((invite)!'')?html}">
      <div class="field">
        <label for="phoneNumber"><span class="req">*</span>手机号码</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" required maxlength="11" inputmode="numeric"
               autocomplete="tel" placeholder="11 位手机号码">
      </div>
      <div class="field">
        <label for="regCaptcha"><span class="req">*</span>图形验证码</label>
        <div class="captcha-row">
          <input id="regCaptcha" name="captcha" type="text" required maxlength="8" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="发送短信前需先填图形码">
          <img data-captcha src="/captcha/default" alt="点击刷新验证码" title="点击刷新验证码" width="146" height="33">
        </div>
      </div>
      <div class="field">
        <label for="mobilecode"><span class="req">*</span>短信验证码</label>
        <div class="code-row">
          <input id="mobilecode" name="mobilecode" type="text" required maxlength="6" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="收到的短信码">
          <button type="button" class="btn btn-outline"
                  data-post="/ucenter/mobilecode" data-fields="phoneNumber>username,captcha"
                  data-count="60" data-label="获取验证码">获取验证码</button>
        </div>
      </div>
      <div class="field">
        <label for="mpassword"><span class="req">*</span>密码</label>
        <input id="mpassword" name="password" type="password" required minlength="6" maxlength="16"
               autocomplete="new-password" placeholder="6 - 16 位">
      </div>
      <div class="field">
        <label for="mpassword2"><span class="req">*</span>确认密码</label>
        <input id="mpassword2" name="password2" type="password" required minlength="6" maxlength="16"
               autocomplete="new-password" placeholder="再输入一次">
      </div>
      <button class="btn btn-primary btn-block" type="submit">注册</button>
    </form>

    <div class="auth-foot">已有账号？<a href="/login">直接登录</a></div>
  </div>
</div>
<div class="auth-links">
  <a href="/">返回首页</a><a href="/login">用户登录</a><a href="/forget_password">找回密码</a>
</div>
</main>
<#include "../common/footer.html">
