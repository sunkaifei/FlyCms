<#-- 修改密码：当前密码 + 新密码 + 确认 + 图形验证码 -->
<#assign pageTitle = "修改密码">
<#include "../common/macros.html">
<#include "../common/header.html">
<main id="main">
<@userDash nav="password" title="修改密码" desc="建议使用大小写字母与数字组合，避免与其他网站重复">
  <form class="panel" data-ajax action="/ucenter/password_update" method="post">
    <div class="panel-bd">
      <div class="field">
        <label for="old_password"><span class="req">*</span>当前密码</label>
        <input id="old_password" name="old_password" type="password" required maxlength="32"
               autocomplete="current-password" placeholder="请输入现在的登录密码">
      </div>
      <div class="field">
        <label for="password"><span class="req">*</span>新密码</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="30"
               autocomplete="new-password" placeholder="6 - 30 位">
      </div>
      <div class="field">
        <label for="password_confirmation"><span class="req">*</span>确认新密码</label>
        <input id="password_confirmation" name="password_confirmation" type="password" required
               minlength="6" maxlength="30" autocomplete="new-password" placeholder="再输入一次新密码">
      </div>
      <div class="field">
        <label for="captcha"><span class="req">*</span>验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" type="text" required maxlength="8" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="请输入右侧 4 位字符">
          <img data-captcha src="/captcha/default" alt="点击刷新验证码" title="点击刷新验证码" width="146" height="33">
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <button class="btn btn-primary" type="submit">提交修改</button>
      </div>
    </div>
  </form>
  <p class="dash-note">修改成功后当前登录状态仍有效；如果在公共电脑登录过，建议同时<a href="/logout">退出登录</a>。</p>
</@userDash>
</main>
<#include "../common/footer.html">
