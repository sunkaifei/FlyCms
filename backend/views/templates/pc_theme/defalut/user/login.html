<#-- 登录页：居中认证卡。表单走 portal.js 异步提交（无 JS 时退化为原生 POST） -->
<#assign pageTitle = "用户登录">
<#include "../common/macros.html">
<#include "../common/header.html">
<main id="main">
<div class="auth">
  <div class="auth-card">
    <div class="auth-hd">
      <h1>登录</h1>
      <p>登录后可参与评论、提问、投稿与收藏</p>
    </div>
    <form data-ajax data-ok-url="/" action="/ucenter/login_act" method="post">
      <input type="hidden" name="redirectUrl" value="${((redirectUrl)!'')?html}">
      <div class="field">
        <label for="username"><span class="req">*</span>邮箱 / 手机 / 用户名</label>
        <input id="username" name="username" type="text" required maxlength="50" autofocus
               autocomplete="username" placeholder="手机号或邮箱">
      </div>
      <div class="field">
        <label for="password"><span class="req">*</span>密码</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="30"
               autocomplete="current-password" placeholder="不少于 6 位">
      </div>
      <div class="field">
        <label for="captcha"><span class="req">*</span>验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" type="text" required maxlength="8" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="请输入右侧 4 位字符">
          <img data-captcha src="/captcha/default" alt="点击刷新验证码" title="点击刷新验证码" width="146" height="33">
        </div>
      </div>
      <div class="auth-row">
        <label class="checkbox"><input type="checkbox" name="rememberMe" value="1" checked> 记住登录状态</label>
        <a href="/forget_password">忘记密码？</a>
      </div>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
    <div class="auth-foot">还没有账号？<a href="/reg">立即注册</a></div>
  </div>
</div>
<div class="auth-links">
  <a href="/">返回首页</a><a href="/reg">注册新账号</a><a href="/forget_password">找回密码</a>
</div>
</main>
<#include "../common/footer.html">
