<#-- 邮箱找回密码：邮箱 → 邮件验证码 → 新密码 -->
<#assign pageTitle = "邮箱找回密码">
<#include "../common/macros.html">
<#include "../common/header.html">
<main id="main">
<div class="auth">
  <div class="auth-card">
    <div class="auth-hd">
      <h1>邮箱找回密码</h1>
      <p>填写注册邮箱并收取验证码，验证通过后设置新密码</p>
    </div>
    <form data-ajax data-ok-url="/login" action="/forget_password/update_password" method="post">
      <div class="field">
        <label for="userEmail"><span class="req">*</span>注册邮箱</label>
        <input id="userEmail" name="username" type="email" required maxlength="64"
               autocomplete="email" placeholder="用于登录的邮箱地址">
      </div>
      <div class="field">
        <label for="code"><span class="req">*</span>邮箱验证码</label>
        <div class="code-row">
          <input id="code" name="code" type="text" required maxlength="6" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="邮件里收到的验证码">
          <button type="button" class="btn btn-outline"
                  data-post="/forget_password/getbackemailcode" data-fields="username"
                  data-count="60" data-label="获取验证码">获取验证码</button>
        </div>
      </div>
      <div class="field">
        <label for="password"><span class="req">*</span>新密码</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="30"
               autocomplete="new-password" placeholder="6 - 30 位">
      </div>
      <button class="btn btn-primary btn-block" type="submit">提交</button>
    </form>
    <div class="auth-foot"><a href="/forget_password">换一种方式</a> · <a href="/login">返回登录</a></div>
  </div>
</div>
</main>
<#include "../common/footer.html">
