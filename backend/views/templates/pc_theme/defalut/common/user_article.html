                    <#-- U3：模型行渲染（list = fly_cmodel_articles 行，userId 筛选由 fly_page_model 承担） -->
                    <div class="index-list-item" data-info-type="1" data-info-id="${list.id!}" data-user-id="${(list.userId)!''}">
                        <h2 class="title"><a href="/articles/${list.shortUrl}.html">${list.title!}</a></h2>
                        <div class="summary">
                            <div class="excerpt">
                                <#if (list.description)?? && list.description != "">${list.description}</#if>
                                <span class="load-content">阅读全文 <i class="fa fa-angle-down"></i></span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <span class="text-muted"><@dt16 (list.createTime)!'' /></span>
                            <button type="button" class="Button Button--plain"><span class="fa fa-comment">&#8203;</span> ${(list.countView)!0} 阅读</button>
                            <a class="Button Button--plain" href="/articles/${list.shortUrl}.html">查看全文</a>
                        </div>
                    </div>
