# ============================================================
# FlyCms 部署安全片段（规划 §8 阶段 A5 交付物）
#
# 应用侧已做的三重防护：
#   1. 扩展名白名单（.jpg/.png/.gif/.webp/.bmp）
#   2. Content-Type 白名单
#   3. 文件头魔数校验（真正的类型判定，不信客户端声明）
#   4. 强制重命名 —— 丢弃用户提交的原始文件名，彻底断掉
#      「xxx.jsp / ../../ / xx.php.jpg」这类路径穿越与解析型攻击
#
# 但纵深防御的原则是"不把安全押在一个点上"：
# 万一将来有人临时绕过应用直接往目录里丢文件，Nginx 层必须兜住。
# 本片段即最后一道防线。
# ============================================================

server {
    # ...（站点其它配置）

    # ---------- 1) 上传目录：只给静态资源，禁止任何脚本执行 ----------
    # FlyCms 上传根目录 Const.UPLOAD_PATH = ./uploadfiles
    # 实际存放路径：uploadfiles/upload/usertmp/{userId}/{fileName}
    location ^~ /upload/ {
        root /www/flycms/uploadfiles;   # 按实际部署路径调整

        # 仅放行静态可预览类型；命中即返回，不进入任何解析流程
        location ~* \.(jpe?g|png|gif|webp|bmp|ico)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # 其余一切（含 .php/.jsp/.asp/.sh/.html 以及无扩展名）一律拒绝
        return 403;
    }

    # 老版本可能存在的直连路径，同样兜住
    location ^~ /uploadfiles/ {
        location ~* \.(jpe?g|png|gif|webp|bmp|ico)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }
        return 403;
    }

    # ---------- 2) 禁止解析常见脚本扩展名（双保险） ----------
    # 即使将来新增了别的上传入口，也拿不到执行能力
    location ~* \.(php|php5|phtml|jsp|jspx|asp|aspx|asa|cer|cdx|sh|pl|py|exe|dll|bin)$ {
        deny all;
    }

    # ---------- 3) 管理与接口入口：禁止外网伪装来源 ----------
    location ^~ /system/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8080;   # 应用端口，按实际调整
    }

    # ---------- 4) 隐藏敏感文件 ----------
    location ~ /\. {
        deny all;
    }
    location ~* (?:^|/)(Dockerfile|\.git|\.env|docker-compose\.yml)(?:$|\.) {
        deny all;
    }

    # ---------- 5) 反代（可选：阶段 I 的微缓存开关，默认关闭） ----------
    # 打开后动态页做 60s 微缓存，配置即生效、应用零改动；
    # 写入接口（/api/system/**）不缓存，避免读写不一致。
    # proxy_cache_path /var/cache/nginx/flycms levels=1:2 keys_zone=flycms:10m
    #                  max_size=1g inactive=60m use_temp_path=off;
    #
    # location / {
    #     proxy_cache flycms;
    #     proxy_cache_valid 200 60s;
    #     proxy_cache_key "$scheme$request_method$host$request_uri";
    #     proxy_cache_bypass $http_authorization;
    #     add_header X-Cache-Status $upstream_cache_status;
    #     proxy_pass http://127.0.0.1:8080;
    # }
    # location ^~ /api/system/ {
    #     proxy_no_cache 1;
    #     proxy_cache_bypass 1;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}

# ============================================================
# 上线前自检（三条，缺一不可）：
#   1. 上传 Controller 只会产出随机名 + 白名单扩展名文件；
#   2. curl 一个不存在包后缀的文件（如 /upload/test.jsp）应返回 403；
#   3. 上传一张真实 .jpg，伪装 Content-Type 为 image/png 时应被拒绝
#      （应用侧魔数校验 + Nginx 双重兜底）。
# ============================================================
